name: Test, package and release LightFlow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Provide Android shell path for host tests
        run: |
          sudo mkdir -p /system/bin
          sudo ln -sfn /bin/sh /system/bin/sh

      - name: Run policy tests
        # Codex/power fixtures exercise Termux-only paths and are run on the
        # device. These portable policy tests cover the packaged module here.
        run: >-
          python -m unittest
          tests.test_memory_pressure_policy
          tests.test_thermal_memory_policy
          tests.test_wifi_diagnostics
          tests.test_radio_scan_policy
          tests.test_consumer_package_policy
          tests.test_oem_diagnostics_policy
          tests.test_notification_package_policy
          tests.test_system_guard
          tests.test_guard_deployment

      - name: Test isolated Codex launch gates
        # These process-policy cases use fixture tools/properties on both hosts.
        # Other Codex installer tests require the actual Termux app UID/paths.
        run: >-
          python -m unittest
          tests.test_codex_policy.CodexPolicyTests.test_current_property_applies_with_stale_or_missing_marker
          tests.test_codex_policy.CodexPolicyTests.test_disabled_property_refuses_current_legacy_marker
          tests.test_codex_policy.CodexPolicyTests.test_stale_property_refuses_current_legacy_marker
          tests.test_codex_policy.CodexPolicyTests.test_empty_property_allows_current_legacy_marker
          tests.test_codex_policy.CodexPolicyTests.test_failed_property_read_refuses_current_legacy_marker
          tests.test_codex_policy.CodexPolicyTests.test_empty_current_boot_never_applies_policy
          tests.test_codex_policy.CodexPolicyTests.test_policy_gate_and_real_process_priority
          tests.test_codex_policy.CodexPolicyTests.test_already_lower_priority_is_preserved

      - name: Select system guard by exact source tree
        id: guard_source
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD:guard)" == b1f67279bbff591d75af382e802602cb7222367d ]]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse verified Actions-built RC5 system guard
        if: steps.guard_source.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reuse_dir=$(mktemp -d "$RUNNER_TEMP/lightflow-guard-reuse.XXXXXX")
          gh release download v1.10.0-rc.5 --repo "$GITHUB_REPOSITORY" \
            --pattern 'LightFlow-v1.10.0-rc.5.zip' --dir "$reuse_dir"
          unzip -p "$reuse_dir/LightFlow-v1.10.0-rc.5.zip" guard.apk > "$reuse_dir/guard.apk"
          printf '%s  %s\n' bca5f0d896cbb09d6f23c18a2146c48bf6fe1b1ad3dbd521a70111198338b8a4 \
            "$reuse_dir/guard.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            "$reuse_dir/guard.apk" > "$reuse_dir/apksigner.txt"
          grep -Fqx 'Signer #1 certificate SHA-256 digest: ef4837bfc6394b1ada8b89ba46f196228441c5665203abd3dad5d01284b3ad7b' \
            "$reuse_dir/apksigner.txt"
          install -m 0644 "$reuse_dir/guard.apk" module/guard.apk

      - name: Build and verify signed system guard
        if: steps.guard_source.outputs.reuse != 'true'
        env:
          LIGHTFLOW_GUARD_KEYSTORE_BASE64: ${{ secrets.LIGHTFLOW_GUARD_KEYSTORE_BASE64 }}
          LIGHTFLOW_GUARD_STORE_PASSWORD: ${{ secrets.LIGHTFLOW_GUARD_STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$LIGHTFLOW_GUARD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lightflow-guard.p12"
          export LIGHTFLOW_GUARD_KEYSTORE="$RUNNER_TEMP/lightflow-guard.p12"
          bash guard/build.sh

      - name: Build Magisk ZIPs
        run: bash build.sh

      - name: Checksum LightFlow ZIP
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          sha256sum "dist/LightFlow-v${version}.zip" > "dist/LightFlow-v${version}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightFlow-${{ github.run_id }}
          path: |
            dist/LightFlow-v*.zip
            dist/LightFlow-v*.sha256
            module/guard.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          [[ "$GITHUB_REF_NAME" == *-rc.* ]] && extra+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${extra[@]}" \
            dist/LightFlow-v*.zip dist/LightFlow-v*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "LightFlow $GITHUB_REF_NAME" \
            --notes-file "RELEASE-${GITHUB_REF_NAME}.md"
